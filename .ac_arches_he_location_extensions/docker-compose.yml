
services:
    arches-he-location-extensions-914a3:
      container_name: arches-he-location-extensions-914a3
      image: he/arches_he_location_extensions-914a3:dev_build
      build:
        args:
          - "PROJ_NAME=arches_he_location_extensions"
          - "PROJ_REPO_NAME=arches-he-location-extensions"
          - "DOCKER_PATH=./arches-he-location-extensions/.ac_arches_he_location_extensions/docker"
        context: ../..
        dockerfile: ./arches-he-location-extensions/.ac_arches_he_location_extensions/Dockerfile
        target: dev
      command: run_arches
      volumes:
        - ../../arches:/web_root/arches
        - ../../arches-he-location-extensions:/web_root/arches_he_location_extensions
        - ./docker:/web_root/docker
        - ../../arches-he-location-extensions-package:/web_root/arches_he_location_extensions_package
        - ../../arches-he-location-extensions-data:/web_root/arches_he_location_extensions_data
      env_file:
        - ./docker/env_file.env
      ports:
        - 8002:8000
        - 5678:5678
      stdin_open: true
      tty: true
    
