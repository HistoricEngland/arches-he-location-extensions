    arches-he-location-extensions-914a3-livereload:
      profiles:
        - livereload
      container_name: arches-he-location-extensions-914a3-livereload
      image: he/arches_he_location_extensions-914a3:dev_build
      command: run_livereload
      volumes:
        - ../../arches:/web_root/arches
        - ../../arches-he-location-extensions:/web_root/arches_he_location_extensions
      env_file:
        - ./docker/env_file.env
      ports:
        - 35729:35729      
      depends_on:
          - arches-he-location-extensions-914a3
      stdin_open: true
      tty: true
    
    arches-he-location-extensions-914a3-webpack:
      container_name: arches-he-location-extensions-914a3-webpack
      image: he/arches_he_location_extensions-914a3:dev_build
      command: run_webpack
      volumes:
        - ../../arches:/web_root/arches
        - ../../arches-he-location-extensions:/web_root/arches_he_location_extensions
      env_file:
        - ./docker/env_file.env
      ports:
        - 8028:8021
      depends_on:
          - arches-he-location-extensions-914a3
      stdin_open: true
      tty: true

networks:
  default:
    external: true
    name: arches-he-location-extensions-914a3-network

volumes:
    arches-log-914a3:
    arches-static-914a3:
